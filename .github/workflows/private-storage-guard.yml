name: private-storage-guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject new or modified private-storage files
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_REF" ]; then
            RANGE="origin/$BASE_REF...$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA...$HEAD_SHA"
          else
            RANGE="$HEAD_SHA^...$HEAD_SHA"
          fi
          node scripts/check-private-storage.mjs --range "$RANGE"
